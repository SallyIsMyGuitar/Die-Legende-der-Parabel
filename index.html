<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Die Legende der Parabel">
  <title>Die Legende der Parabel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="rotate-hint">Bitte Gerät drehen</div>
  <div id="game-wrap">
    <canvas id="game-canvas" width="256" height="224"></canvas>
  </div>
  <div id="touch-controls" hidden>
    <div id="dpad">
      <button class="dpad-btn up" data-dir="up" aria-label="Oben"></button>
      <button class="dpad-btn left" data-dir="left" aria-label="Links"></button>
      <button class="dpad-btn right" data-dir="right" aria-label="Rechts"></button>
      <button class="dpad-btn down" data-dir="down" aria-label="Unten"></button>
    </div>
    <div id="action-buttons">
      <!-- kleine Tasten für Merkbuch und Schwert über A/B -->
      <button class="item-btn" data-btn="book" aria-label="Merkbuch">
        <span class="icon-book"></span><span class="item-label">Buch</span>
      </button>
      <button class="item-btn" data-btn="sword" aria-label="Schwert">
        <span class="icon-sword"></span><span class="item-label">Schwert</span>
      </button>
      <button class="action-btn" data-btn="b" aria-label="Aktion B">B<span class="btn-label" id="label-b"></span></button>
      <button class="action-btn" data-btn="a" aria-label="Aktion A">A<span class="btn-label" id="label-a"></span></button>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/save.js"></script>
  <script src="js/render.js"></script>
  <script src="js/font.js"></script>
  <script src="js/people.js"></script>
  <script src="js/buildings.js"></script>
  <script src="js/interior.js"></script>
  <script src="js/rooms.js"></script>
  <script src="js/raetsel.js"></script>
  <script src="js/spiegel.js"></script>
  <script src="js/gezeiten.js"></script>
  <script src="js/dungeon.js"></script>
  <script src="js/turm.js"></script>
  <script src="js/wasser.js"></script>
  <script src="js/merkbuch.js"></script>
  <script src="js/boss.js"></script>
  <script src="js/world.js"></script>
  <!-- Wueste, Tempel und Schule erst nach world.js: Sie melden ihre
      Bildschirme beim Laden direkt per World.addScreen an -->
  <script src="js/wueste.js"></script>
  <script src="js/platten.js"></script>
  <script src="js/sandtempel.js"></script>
  <script src="js/schule.js"></script>
  <script src="js/input.js"></script>
  <script src="js/player.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/sword.js"></script>
  <script src="js/dialog.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/testpage.js"></script>
  <script src="js/taskui.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
